[theme]
# Primary teal accent
primaryColor = "#008080"

# Ice White application background
backgroundColor = "#F0F8FF"

# Light Gray secondary surface
secondaryBackgroundColor = "#E0E0E0"

# Slate Gray text for readability
textColor = "#2F4F4F"

# Modern, clean sans-serif font
font = "sans serif"

[server]
# Your existing max upload size limit (10MB)
maxUploadSize = 10

# Disables Streamlit CORS checks (helps smooth tunneling like Ngrok!)
enableCORS = false 

enableXsrfProtection = false